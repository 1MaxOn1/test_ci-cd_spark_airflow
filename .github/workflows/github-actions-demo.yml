name: test-local-device
on: push
jobs:
    test-build:
        runs-on: self-hosted-amd64
        steps:
            - name: Just print hello
              run: echo 'Hello'
    clone-repo:
        if: [[ ! -d "lab1" ]];
        runs-on: self-hosted-amd64
        steps:
            - name: Clone repo
              run: |
                mkdir -p lab1 
                if [ -n "$(ls -A "lab1" 2>/dev/null)" ]; then
                    echo "Repo already downloaded"
                else
                    git clone https://github.com/1MaxOn1/test_ci-cd_spark_airflow.git 
                fi;
    deploy-services:
        runs-on: self-hosted-amd64
        steps:
            - name: Build docker images
              run: |
                cd lab1
                cd docker compose -f docker-compose.yaml up -d
        needs: clone-repo