name: test-local-device
on: push
jobs:
    test-build:
        runs-on: self-hosted-amd64
        steps:
            - name: Just print hello
              run: echo 'Hello'
    clone-repo:
        runs-on: self-hosted-amd64
        steps:
            - name: Clone repo
              run: |
                mkdir -p lab1 
                cd lab1   
                git clone https://github.com/1MaxOn1/test_ci-cd_spark_airflow.git 
    deploy-services:
        runs-on: self-hosted-amd64
        steps:
            - name: Build docker images
              run: |
                cd lab1 && \
                cd docker compose -f docker-compose.yaml up -d
        needs: clone-repo