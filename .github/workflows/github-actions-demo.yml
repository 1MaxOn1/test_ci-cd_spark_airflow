name: test-local-device
on: push
jobs:
    test-build:
        runs-on: self-hosted-amd64
        steps:
            - name: Just print hello
              run: echo 'Hello'
    clone-repo:
        runs-on: self-hosted-amd64
        steps:
            - name: Clone repo
              run: |
                echo "Inside mount folder repos and start cloning"
                if [ -n "$(ls -A "/home/runner/actions-runner/repos" 2>/dev/null)" ]; then
                    echo "Repo already downloaded"
                else
                    git clone https://github.com/1MaxOn1/test_ci-cd_spark_airflow.git /home/runner/actions-runner/repos
                    echo 'Cloning finished'
                fi;
                echo "Start copy folders files"
                sudo cp -R /home/runner/actions-runner/repos/dags /home/runner/actions-runner/shared/
                sudo cp -R /home/runner/actions-runner/repos/spark /home/runner/actions-runner/shared/

    deploy-services:
        runs-on: self-hosted-amd64
        steps:
            - name: Build docker images
              run: |
                # cd /home/runner/actions-runner/repos
                docker compose -f /home/runner/actions-runner/repos/docker-compose.yaml up -d --build
        needs: clone-repo