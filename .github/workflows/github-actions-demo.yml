name: test-local-device
on: push
jobs:
    test-build:
        runs-on: self-hosted-amd64
        steps:
            - name: Just print hello
              run: echo 'Hello'
    clone-repo:
        runs-on: self-hosted-amd64
        steps:
            - name: Clone repo
              run: |
                echo "Inside mount folder repos and start cloning"
                if [ -n "$(ls -A "./repos" 2>/dev/null)" ]; then
                    echo "Repo already downloaded"
                else
                    git clone https://github.com/1MaxOn1/test_ci-cd_spark_airflow.git ./repos 
                    echo 'Cloning finished'
                fi;

    deploy-services:
        runs-on: self-hosted-amd64
        steps:
            - name: Build docker images
              run: |
                cd lab1/test_ci-cd_spark_airflow
                docker compose -f docker-compose.yaml up -d --build
        needs: clone-repo