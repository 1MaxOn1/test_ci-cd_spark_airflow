services:
  runner:
    build:
      dockerfile: Dockerfile.githubrunner
      context: .

    restart: unless-stopped
    env_file: .env

    deploy:
      resources:
        limits:
          cpus: 2
          memory: 2G
        reservations:
          cpus: '0.1'
          memory: 256M
    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock